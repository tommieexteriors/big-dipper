name: Refresh dip data

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays after the US market close (21:30 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m bigdipper screen
      - name: Commit updated data
        run: |
          git config user.name "big-dipper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/dippers.json
          git diff --staged --quiet || git commit -m "Refresh dip data"
          git push
